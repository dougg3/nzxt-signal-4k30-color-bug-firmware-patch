name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build
        run: make

      - name: Checksum
        run: sha256sum mcu_flash.exe | tee mcu_flash.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mcu_flash
          path: |
            mcu_flash.exe
            mcu_flash.exe.sha256

      # Pushing a tag like v1.0 publishes a GitHub release with the binary.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mcu_flash.exe mcu_flash.exe.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
